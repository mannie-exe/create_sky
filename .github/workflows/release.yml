name: Release pack
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: pack-release-${{ github.ref }}
  cancel-in-progress: false
env:
  EMPACK_VERSION: v0.8.2-beta
  # Build the reference profiles in build.default.
  EMPACK_PROFILES: ''
  JAVA_VERSION: '21'
  EMPACK_RELEASE_NOTES: docs/RELEASE_NOTES.md
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install verified empack release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/empack-ci.py install
      - name: Build maintained resources
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/audit-changes.py
          python3 scripts/build-fixes.py
          python3 scripts/build-resource-patches.py
      - name: Build and publish selected profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/empack-ci.py release
