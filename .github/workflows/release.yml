name: Release pack
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-empack
      - name: Check tag matches pack version
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          status = json.loads(subprocess.check_output(['empack', 'status', '--json']))
          author = next(c for c in status['contexts'] if c['context'] == 'author')
          assert author['state'] == 'valid' and author['lock'] == 'valid', status
          assert os.environ['GITHUB_REF_NAME'] == 'v' + author['version']
          PYCODE
      - name: Build verified distributions
        run: empack build --yes --profile modrinth --profile prism --profile server
      - name: Generate artifact checksums
        run: (cd dist && sha256sum ./*.zip ./*.mrpack > SHA256SUMS)
      - name: Publish tagged distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.mrpack dist/SHA256SUMS --verify-tag --title "Create Sky $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
