name: Install empack
description: Install the verified Linux empack 0.7.0-beta release
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: '21'
    - shell: bash
      run: |
        set -euo pipefail
        archive=empack-0.7.0-beta-x86_64-unknown-linux-gnu.tar.gz
        curl --fail --location --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/inherent-design/empack/releases/download/v0.7.0-beta/$archive"
        echo "f0943f219575600067302741ee1f570f39ff74133479a9168bc9c2f9b2610a13  $RUNNER_TEMP/$archive" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/empack-bin"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/empack-bin"
        chmod +x "$RUNNER_TEMP/empack-bin/empack"
        echo "$RUNNER_TEMP/empack-bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/empack-bin/empack" --version
