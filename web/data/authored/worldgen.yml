schema: 1
records:
  - id: islands/current
    title: Current Sky Archipelago configuration
    evidence: configuration
    detail: The pack uses CONSISTENT cluster spacing 1494, matching the current seed's effective DYNAMIC value. The former DYNAMIC 32 to 1500 range selects one spacing per world. RANDOM size mode, radius settings 10 to 500, density 0.4, center Y -32 to 300, thickness 300, VOID overlap and disabled ocean-biome islands are unchanged. Size settings are not hard bounds on every scaled island descriptor. Both earlier worlds were archived. The 0.1.8 random-seed horseshoe-spawn world is now retained with its seed saved beside the local backups and pinned in local server.properties. The server is stopped; this review does not regenerate terrain. The distributed server template remains seed-free.
    sources:
      [
        'sky_archipelago-common.toml',
        'pack docs/development/worldgen.md',
        'runtime/worldgen_review.json',
      ]
  - id: ores/pregen
    title: Archived terrain baseline
    evidence: measured
    detail: This survey describes the archived world, not the current horseshoe-spawn world. Refresh it after pregen. Region headers were counted exhaustively; blocks are sampled reproducibly within every populated region. Air volume changes per-world-area yields, while vertical terrain availability changes which ore bands survive. A recipe or configured ore feature alone does not guarantee obtainable quantities.
    sources: ['scripts/world.py', 'data/generated/world.json']
  - id: structures/deferred
    title: Structure generation tuning is a separate pass
    evidence: decision
    detail: Sky Villages is installed with bounded absolute height, repaired pools and village-tag membership. Its default 70/65-chunk candidate distribution and biome eligibility remain unchanged. Unreleased source adds Sky Village Neighbors with a 64-block minimum terrain gap, 512-block maximum host distance and minimum native host radius 96; existing saved villages are unaffected. Structures Arise and the broader structure-density pass remain deferred. Delivery availability still depends on valid reachable endpoints.
    sources: ['user direction, 2026-10-21']
  - id: structures/sky-village-resources
    title: Village foundations and crops
    evidence: native-placement-survey
    detail: One ordered foundation pass targets 0.025% diamond ore, 0.15% emerald ore and 20% diorite. Across 24 controlled villages on four seeds, diamond ore ranged 0–5 (median 2), emerald ore 5–33 (median 17). Crops and chest loot are unchanged. Before proximity filtering, natural Sky Archipelago checks found 74 valid starts in 100 candidate cells; eight fully generated villages had no shielded placement failures. Controlled counts exclude terrain; natural bounding-box counts do not. Fortune, multiplayer loot, safe approaches and completed deliveries need playtesting. See World & ores for the dated survey and per-village counts.
    sources:
      [
        'pack docs/development/structures.md',
        'Sky Villages 1.0.6 templates and house_processor',
        'Minecraft 1.21.1 RuleProcessor',
      ]
