schema: 1
records:
  - id: travel/glider
    title: Glide and climb local updrafts
    inputs: [[reliable_gliders:glider]]
    outputs: []
    evidence: implementation
    detail: Hold the glider; durability drains during use. Default updraft height 15, strength 0.7; repair and updraft block tags are editable. Flight range needs measured launch altitude and descent rate.
    sources:
      ['https://github.com/evanbones/Reliable-Gliders', 'reliable_gliders.json']
  - id: travel/rope
    title: Establish a short crossing
    inputs: []
    outputs: []
    evidence: implementation
    detail: Throwable connector ranges are 10 blocks by hand, 20 with launcher, 40 mounted; Simulated ropes max 40. Plunger range 64, with backtank air supported. These are nearby crossing tools, not universal long-range bridges.
    sources:
      [
        'throwable rope connector config',
        'simulated-server.toml',
        'climbable_ropes-server.toml',
      ]
  - id: logistics/docking
    title: Dock and transfer cargo
    inputs: []
    outputs: []
    evidence: implementation
    detail: Simulated docking connectors transfer items and fluids between inventories/tanks; matching pose and physical access matter. Includes comparator progress. A moving industrial base can have a purpose beyond passenger transport.
    sources: ['Simulated bundled Ponder translations', 'simulated-server.toml']
  - id: logistics/delivery
    title: Village delivery contracts
    inputs: []
    outputs: []
    evidence: implementation
    detail: Quest board creates physical schematic cargo and route compasses. Village mode targets structure positions, not a simulated village economy or NPC demand. Four offers and a 120-minute deadline. Search offsets are 500 to 2000 blocks, but ADQ 1.1.1 does not enforce that maximum after locating a structure; actual routes can be longer. Damaged cargo reduces payout. The isolated Compat candidate retains endpoint chunks, uses horizontal route-distance checks and retries unsafe Sky Village locate points within their bounds. A native offer was generated; completed cargo delivery remains unverified.
    sources:
      [
        'https://modrinth.com/mod/aeronautics-delivery-quests',
        'aeronautics_delivery_quests.toml',
      ]
  - id: propulsion/solid
    title: Solid-fuel thrust
    inputs: [[createpropulsion:solid_fuel_thruster]]
    outputs: []
    evidence: implementation
    detail: Present in released 1.1.5, with a copper/iron-sheet, andesite-alloy, chute and pipe recipe. Potential early propulsion role; preserve distinct endurance/control tradeoffs before changing recipes.
    sources:
      [
        'createpropulsion:crafting/solid_fuel_thruster',
        'createpropulsion-common.toml',
      ]
  - id: propulsion/liquid
    title: Turpentine supplies liquid thrusters
    inputs: [[createpropulsion:thruster]]
    outputs: []
    evidence: implementation
    detail: 'Turpentine needs unheated basin mixing of pine resin and water. A single standard thruster consumes a base 1 mB/tick multiplied by the fuel burn rate: 150% for turpentine, 100% for lava. A 1000 mB tank therefore lasts about 33.3 seconds on turpentine or 50 seconds on lava at full throttle and 20 TPS, without multiblock or oxidizer modifiers. Turpentine provides 100% thrust versus lava at 75%; these are fuel budgets, not flight-range measurements.'
    sources:
      [
        'createpropulsion:thruster_fuels/turpentine.json',
        'createpropulsion-common.toml',
      ]
  - id: power/ion
    title: Electrical propulsion and persistent power infrastructure
    inputs: [[createpropulsion:ion_thruster]]
    outputs: []
    evidence: implementation
    detail: Default 40 FE/tick at full throttle and 4000 FE internal buffer give five seconds at 20 TPS without supply. Power Grid and docking can make charging infrastructure meaningful; actual ship power transfer needs flight testing.
    sources: ['createpropulsion-common.toml', 'simulated-server.toml']
  - id: power/flywheel-storage
    title: Flywheel Bearing storage is disabled
    inputs: [[bits_n_bobs:flywheel_bearing]]
    outputs: []
    evidence: configuration
    detail: The block is available and its recipe requires a Brass Casing, but flywheelBearingStorageCapability is false. It currently provides no kinetic-storage route. A proposed persistent role is burst power or engine-off operation; enable and test storage before claiming that role.
    sources: ['bits_n_bobs-common.toml', 'bits_n_bobs-server.toml']
