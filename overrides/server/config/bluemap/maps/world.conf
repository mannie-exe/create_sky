# All saved Overworld terrain, including pregenerated, unvisited chunks.
world: "world"
dimension: "minecraft:overworld"
name: "Create Sky"
sorting: 0
min-inhabited-time: 0
# No X/Z limits. Use the complete Create Sky Compat build envelope.
min-y: -128
max-y: 767
# Preserve shaded island undersides; cave interiors are also eligible.
remove-caves-below-y: -128
cave-detection-ocean-floor: 10000
ambient-light: 0.1
enable-hires: true
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
storage: "file"
